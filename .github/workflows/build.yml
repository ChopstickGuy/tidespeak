name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libxkbcommon-dev cmake
      - name: Tests
        run: cargo test --workspace --locked
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket
        run: |
          mkdir -p dist/tidespeak
          cp target/release/tidespeak target/release/tidespeak-server dist/tidespeak/
          cp packaging/linux/tidespeak.desktop packaging/linux/install.sh crates/client/assets/tidespeak.svg README.md LICENSE dist/tidespeak/
          tar -C dist -czf tidespeak-linux-x86_64.tar.gz tidespeak
      - uses: actions/upload-artifact@v4
        with:
          name: tidespeak-linux-x86_64
          path: tidespeak-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Tidespeak | Out-Null
          Copy-Item target/release/tidespeak.exe, target/release/tidespeak-server.exe, README.md, LICENSE dist/Tidespeak/
          Compress-Archive -Path dist/Tidespeak -DestinationPath tidespeak-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tidespeak-windows-x86_64
          path: tidespeak-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tidespeak-linux-x86_64.tar.gz
            tidespeak-windows-x86_64.zip
          generate_release_notes: true
